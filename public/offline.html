<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — Pereira Unida</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1.25rem;
      background: #fff8f0;
      color: #1c1410;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
    }
    p.lead {
      margin: 0;
      color: #4a3b32;
      max-width: 26rem;
    }
    .badge {
      display: inline-block;
      background: #a61b1b;
      color: #fff8f0;
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }
    .hotlines {
      width: 100%;
      max-width: 22rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .hotlines a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #1c1410;
      border-radius: 1rem;
      padding: 0.9rem 1.1rem;
      text-decoration: none;
      color: #1c1410;
      font-weight: 800;
      background: #ffffff;
    }
    .hotlines a span.num {
      color: #a61b1b;
      font-size: 1.1rem;
    }
    button {
      border: 2px solid #1c1410;
      background: #1c1410;
      color: #fff8f0;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <span class="badge">Sin conexión</span>
  <h1>No hay internet en este momento</h1>
  <p class="lead">
    Pereira Unida necesita conexión para reportar o buscar ayuda. Mientras
    tanto, estas líneas de emergencia funcionan por llamada normal:
  </p>

  <div class="hotlines">
    <a href="tel:132"><span>Cruz Roja</span><span class="num">132</span></a>
    <a href="tel:119"><span>Bomberos Pereira</span><span class="num">119</span></a>
    <a href="tel:3220082"><span>Bomberos Dosquebradas</span><span class="num">3220082</span></a>
    <a href="tel:144"><span>Defensa Civil</span><span class="num">144</span></a>
  </div>

  <button type="button" onclick="location.reload()">Reintentar conexión</button>
</body>
</html>
